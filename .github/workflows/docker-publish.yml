name: Test and publish Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Pest tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      FILESYSTEM_DISK: local
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and prepare test environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
          npm ci --ignore-scripts
      - name: Build frontend assets
        run: npm run build
      - name: Run all unit, feature, and domain tests
        run: composer test

  publish:
    name: Publish Docker images
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: aaronpresley
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            aaronpresley/glade-reader-web:latest
            aaronpresley/glade-reader-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build and push CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production-cli
          platforms: linux/amd64
          push: true
          tags: |
            aaronpresley/glade-reader-cli:latest
            aaronpresley/glade-reader-cli:sha-${{ github.sha }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
